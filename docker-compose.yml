services:
  mysql:
    image: mysql:8.4
    container_name: sngvkus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sngvkus
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - sngvkus_mysql_data:/var/lib/mysql
      - ./database/sngvkus_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  sngvkus_mysql_data:

